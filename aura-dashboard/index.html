<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#02160c" />
    <title>Aura Academy</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.json" />
    <style>
      :root {
        --bg: #02160c; --surface: #061a10; --surface2: #0a2417;
        --text: #f0fff7; --text-dim: rgba(240,255,247,.68); --text-faint: rgba(240,255,247,.4);
        --green: #34e89a; --green-dim: rgba(52,232,154,.1); --green-border: rgba(52,232,154,.22);
        --radius: 10px; --radius-lg: 16px;
      }
      html, body, #root { background: var(--bg); }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', async () => {
          try {
            const registration = await navigator.serviceWorker.register('/sw.js', { updateViaCache: 'none' })
            await registration.update()
          } catch (error) {
            console.warn('Service worker unavailable', error)
          }
        })
      }
    </script>
  </body>
</html>
